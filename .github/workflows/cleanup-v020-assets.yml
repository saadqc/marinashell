name: Clean v0.2.0 release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-v020-assets.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove unpacked Windows helper binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in elevate.exe MarinaShell.exe pagent.exe winpty-agent.exe; do
            gh release delete-asset v0.2.0 "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done
