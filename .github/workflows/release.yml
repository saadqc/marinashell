name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # node-pty's current node-gyp toolchain does not yet recognize the
        # Visual Studio 2026 image behind windows-latest.
        os: [ubuntu-latest, windows-2022, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Build and package
        run: npm run dist -- --publish never
        env:
          # No notarization; macOS uses ad-hoc signing only.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MarinaShell ${{ github.ref_name }} — Project workspaces and inline editor
          body_path: CHANGELOG.md
          files: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.dmg
            release/**/MarinaShell.Setup.*.exe
            release/**/*-win.zip
          fail_on_unmatched_files: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
