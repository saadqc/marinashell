<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>MarinaShell</title>
  <link rel="stylesheet" href="./node_modules/xterm/css/xterm.css" />
  <link rel="stylesheet" href="renderer/theme.css" />
  <link rel="stylesheet" href="renderer/base.css" />
  <link rel="stylesheet" href="renderer/workspace.css" />
  <link rel="stylesheet" href="renderer/projects.css" />
</head>

<body>
  <div id="app">
    <header id="app-header">
      <div class="app-brand"><img src="assets/icons/dock.png" alt="" /><strong>MarinaShell</strong></div>
      <details id="open-menu" class="layout-menu"><summary>Open<i data-icon="chevron-down"></i></summary><div class="layout-menu-items"><button id="open-connect-btn">Connect to…</button><button id="open-project-btn">Open project…</button><button id="new-project-btn">New project…</button></div></details>
      <button id="command-search" aria-label="Search commands and sessions"><i data-icon="search"></i><span>Search commands and sessions</span><kbd>⌘ K</kbd></button>
      <div class="header-actions"><button id="sidebar-collapse-btn" class="icon-btn" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true"><i data-icon="panel-left-close"></i></button><button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings"><i data-icon="settings-2"></i></button></div>
    </header>
    <nav id="activity-rail" aria-label="Projects and workspace tools">
      <div id="project-rail" role="group" aria-label="Opened projects"><div id="open-projects"></div><button id="project-add-btn" class="project-add" title="Open or create a project" aria-label="Open or create a project"><i data-icon="plus"></i></button></div>
      <div id="tool-navigation"></div>
      <div class="rail-bottom"><button id="extensions-btn" class="rail-button" title="Extensions" aria-label="Extensions"><i data-icon="puzzle"></i><span>Extensions</span></button></div>
    </nav>
    <div id="session-tabs-row">
      <div id="session-tabs" role="tablist" aria-label="Terminal sessions"></div>
      <button id="new-tab-btn" class="icon-btn" title="New tab" aria-label="New tab"><i data-icon="plus"></i></button>
    </div>
    <aside id="sidebar" aria-label="Project files">
      <div class="sidebar-heading"><span id="project-heading">Files</span><button id="disconnect-session-btn" class="icon-btn" title="Disconnect session" aria-label="Disconnect session"><i data-icon="unplug"></i></button><button id="project-options-btn" class="icon-btn" title="Project settings" aria-label="Project settings"><i data-icon="ellipsis"></i></button></div>
      <div class="sidebar-session"><span id="sidebar-session-label">Files</span></div>
      <div id="status" role="status">Disconnected</div><div id="files-connect"><span>Files will appear when this session is connected.</span></div>
      <div id="status-transfer"><div class="row"><div class="label" id="status-transfer-label"></div><div class="meta" id="status-transfer-meta"></div></div><div class="bar"><div class="fill" id="status-transfer-fill"></div></div></div>
      <div id="tabs" role="tablist" aria-label="Sidebar tools" hidden><button class="tab-btn active" data-tab="files">Files</button></div>
      <div id="tab-panels">
        <div id="tab-files" class="tab-panel active">
          <div class="section tree-section">
            <button class="section-header" data-section="tree">
              <span>Files</span>
              <span id="tree-chevron">▾</span>
            </button>
            <div class="section-body" id="tree-section">
              <div class="path-row">
                <button id="back-btn" class="icon-btn" title="Back" aria-label="Back"><i data-icon="chevron-left"></i></button>
                <button id="forward-btn" class="icon-btn" title="Forward" aria-label="Forward"><i data-icon="chevron-right"></i></button>
                <input type="text" id="path-input" placeholder="Go to a folder…" aria-label="Folder path" />
                <button id="path-go-btn" class="icon-btn" title="Go" aria-label="Go"><i data-icon="corner-down-left"></i></button>
              </div>
              <div id="file-tree">Not connected</div>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <main id="workspace" aria-label="Active workspace">
      <div id="session-bar">
        <div id="view-toolbar"></div>
      </div>
      <div id="dock-root">
        <div id="terminal-stack"></div>
      </div>
      <div id="statusbar" aria-label="Session status"></div>
    </main>
  </div>
  <div id="connection-controls" hidden><select id="host-select" aria-label="Connection"></select><button id="connect-btn">Connect</button></div>
  <dialog id="password-modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="password-title">
      <div id="password-title" class="modal-title">SSH Password Required</div>
      <div id="password-host" class="modal-subtitle"></div>
      <div id="password-message" class="modal-message"></div>
      <div id="password-attempt" class="modal-subtitle"></div>
      <label class="modal-field">
        <span>Password</span>
        <input id="password-input" type="password" autocomplete="current-password" />
      </label>
      <label class="modal-checkbox">
        <input id="password-remember" type="checkbox" />
        <span id="password-remember-text">Remember password for this host</span>
      </label>
      <div class="modal-actions">
        <button id="password-cancel" class="ghost-btn" type="button">Cancel</button>
        <button id="password-submit" type="button">Connect</button>
      </div>
    </div>
  </dialog>
  <script src="./node_modules/xterm/lib/xterm.js"></script>
  <script src="./node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="./node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script type="module" src="renderer/index.js"></script>
</body>

</html>
