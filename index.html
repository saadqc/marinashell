<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>MarinaShell</title>
  <link rel="stylesheet" href="./node_modules/xterm/css/xterm.css" />
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #191a1c;
      color: #bcbec4;
    }

    #app {
      display: flex;
      height: 100dvh;
      width: 100vw;
    }

    #sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2b2d30;
      background: #191a1c;
      overflow: hidden;
      transition: width 220ms ease, border-color 220ms ease;
    }

    #app.sidebar-collapsed #sidebar {
      width: 0;
      border-right-color: transparent;
    }

    #tabs {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid #2b2d30;
    }

    .tab-btn {
      flex: 1;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #43454a;
      background: #2b2d30;
      color: #9da0a8;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #393b40;
      color: #bcbec4;
      border-color: #4e5157;
    }

    #tab-panels {
      flex: 1;
      overflow: hidden;
    }

    .tab-panel {
      height: 100%;
      overflow: auto;
      display: none;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    .tab-panel.active {
      display: flex;
    }

    #workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #191a1c;
    }

    #session-bar {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid #2b2d30;
      background: #191a1c;
    }

    #view-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      justify-content: space-between;
    }

    #session-tabs-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 30px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid #43454a;
      background: #2b2d30;
      color: #9da0a8;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .tool-btn:hover {
      border-color: #4e5157;
      color: #bcbec4;
    }

    .tool-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .tool-btn:disabled:hover {
      border-color: #43454a;
      color: #9da0a8;
    }

    .tool-btn.active {
      background: #393b40;
      color: #bcbec4;
      border-color: #4e5157;
    }

    .dock-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: inline-block;
      background-color: #9da0a8;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;
      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;
    }

    .lucide {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      flex: 0 0 auto;
    }

    #dock-root {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 10px;
      gap: 10px;
      overflow: hidden;
      background: #191a1c;
    }

    #statusbar {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-top: 1px solid #2b2d30;
      background: #191a1c;
      color: #9da0a8;
      font-size: 12px;
      overflow: hidden;
      user-select: none;
    }

    .status-seg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      height: 22px;
      border-radius: 8px;
      border: 1px solid #43454a;
      background: #2b2d30;
      color: #9da0a8;
      white-space: nowrap;
      min-width: 0;
    }

    .status-select {
      height: 22px;
      max-width: 220px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(25, 26, 28, 0.65);
      color: #bcbec4;
      font-size: 12px;
      padding: 0 6px;
      outline: none;
      cursor: pointer;
    }

    .status-select:hover {
      border-color: rgba(255, 255, 255, 0.16);
    }

    .status-seg strong {
      color: #bcbec4;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #585b70;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
    }

    .status-dot.good { background: #a6e3a1; box-shadow: 0 0 0 3px rgba(166, 227, 161, 0.12); }
    .status-dot.warn { background: #f9e2af; box-shadow: 0 0 0 3px rgba(249, 226, 175, 0.12); }
    .status-dot.bad { background: #f38ba8; box-shadow: 0 0 0 3px rgba(243, 139, 168, 0.12); }

    .status-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    #statusbar .spacer {
      flex: 1;
      min-width: 10px;
    }

    .dock-split {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      gap: 0;
      align-items: stretch;
    }

    .dock-split.dock-row {
      flex-direction: row;
    }

    .dock-split.dock-col {
      flex-direction: column;
    }

    .dock-leaf {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(25, 26, 28, 0.92);
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }

    .dock-leaf.active {
      border-color: rgba(141, 208, 255, 0.45);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25), 0 0 0 3px rgba(141, 208, 255, 0.12);
    }

    .dock-leaf-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(43, 45, 48, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
      cursor: default;
    }

    .dock-leaf-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #bcbec4;
      min-width: 0;
    }

    .dock-leaf-title .name {
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 320px;
    }

    .dock-leaf-actions {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .dock-mini-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(25, 26, 28, 0.65);
      color: #9da0a8;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .dock-mini-btn:hover {
      border-color: rgba(255, 255, 255, 0.14);
      color: #bcbec4;
    }

    .dock-mini-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .dock-mini-btn:disabled:hover {
      border-color: rgba(255, 255, 255, 0.08);
      color: #9da0a8;
    }

    .dock-leaf-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      position: relative;
      background: rgba(25, 26, 28, 0.2);
    }

    .dock-resizer {
      flex: 0 0 8px;
      background: transparent;
      position: relative;
    }

    .dock-resizer::before {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 2px;
      height: 70%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
    }

    .dock-split.dock-row > .dock-resizer {
      cursor: col-resize;
    }

    .dock-split.dock-col > .dock-resizer {
      cursor: row-resize;
    }

    .dock-split.dock-col > .dock-resizer::before {
      width: 70%;
      height: 2px;
    }

    .dock-resizer:hover::before {
      background: rgba(141, 208, 255, 0.22);
    }

    #session-tabs {
      display: flex;
      gap: 6px;
      flex: 1;
      overflow-x: auto;
      align-items: stretch;
      min-height: 34px;
    }

    .session-tab {
      --tab-border: #43454a;
      --tab-bg: #2b2d30;
      --tab-active-bg: #393b40;
      --tab-active-border: #4e5157;
      --tab-fg: #9da0a8;
      --tab-dot: #596577;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--tab-border);
      background: var(--tab-bg);
      color: var(--tab-fg);
      cursor: pointer;
      white-space: nowrap;
      min-width: 0;
      transition: color 160ms ease, background 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    .session-tab:hover {
      color: #dbe3ef;
      border-color: var(--tab-active-border);
    }

    .session-tab:focus-visible,
    .session-group-layout:focus-visible,
    #sidebar-collapse-btn:focus-visible {
      outline: 2px solid rgba(141, 208, 255, 0.8);
      outline-offset: 2px;
    }

    .session-tab.active {
      background: var(--tab-active-bg);
      color: #bcbec4;
      border-color: var(--tab-active-border);
    }

    .tab-color-blue {
      --tab-border: rgba(95, 142, 170, 0.42);
      --tab-bg: rgba(63, 105, 132, 0.18);
      --tab-active-bg: rgba(69, 119, 150, 0.34);
      --tab-active-border: #5f8eaa;
      --tab-fg: #b3cad8;
      --tab-dot: #6f9fb9;
    }

    .tab-color-green {
      --tab-border: rgba(100, 144, 122, 0.42);
      --tab-bg: rgba(66, 111, 87, 0.18);
      --tab-active-bg: rgba(71, 126, 96, 0.34);
      --tab-active-border: #64907a;
      --tab-fg: #b9d2c5;
      --tab-dot: #75a78d;
    }

    .tab-color-amber {
      --tab-border: rgba(157, 130, 82, 0.42);
      --tab-bg: rgba(124, 94, 45, 0.18);
      --tab-active-bg: rgba(143, 108, 49, 0.34);
      --tab-active-border: #9d8252;
      --tab-fg: #d8c8aa;
      --tab-dot: #b39762;
    }

    .tab-color-red {
      --tab-border: rgba(155, 98, 109, 0.42);
      --tab-bg: rgba(120, 66, 76, 0.18);
      --tab-active-bg: rgba(139, 72, 84, 0.34);
      --tab-active-border: #9b626d;
      --tab-fg: #d9bac0;
      --tab-dot: #b47681;
    }

    .tab-color-purple {
      --tab-border: rgba(128, 111, 158, 0.42);
      --tab-bg: rgba(93, 75, 126, 0.18);
      --tab-active-bg: rgba(105, 83, 143, 0.34);
      --tab-active-border: #806f9e;
      --tab-fg: #c9c0d9;
      --tab-dot: #9582b3;
    }

    .tab-color-slate {
      --tab-border: rgba(111, 124, 141, 0.45);
      --tab-bg: rgba(78, 91, 108, 0.2);
      --tab-active-bg: rgba(87, 102, 121, 0.36);
      --tab-active-border: #6f7c8d;
      --tab-fg: #c0c8d2;
      --tab-dot: #8492a5;
    }

    .session-tab .close-btn {
      font-size: 12px;
      color: #6f737a;
    }

    .session-tab-label {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-tab.dragging {
      opacity: 0.38;
    }

    .session-tab.drag-over {
      border-color: rgba(141, 208, 255, 0.75);
      box-shadow: inset 2px 0 rgba(141, 208, 255, 0.75);
    }

    .session-group {
      display: flex;
      align-items: stretch;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
      background: rgba(43, 45, 48, 0.72);
      overflow: hidden;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .session-group.active {
      border-color: rgba(141, 208, 255, 0.35);
      box-shadow: inset 0 0 0 1px rgba(141, 208, 255, 0.08);
    }

    .session-group.drag-over {
      border-color: rgba(141, 208, 255, 0.75);
    }

    .session-group-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 5px 3px 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.07);
      color: #aeb8c7;
      font-size: 11px;
      user-select: none;
      cursor: default;
    }

    .session-group-name {
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .session-group-layout {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 5px;
      border: 0;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      color: #8894a5;
      font-size: 10px;
    }

    .session-group-layout:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #bcbec4;
    }

    .session-group-tabs {
      display: flex;
      align-items: stretch;
      gap: 4px;
      padding: 3px;
    }

    .session-group-tabs .session-tab {
      border-color: transparent;
      border-radius: 6px;
      padding-block: 3px;
    }

    .session-group-tabs .session-tab.active {
      border-color: var(--tab-active-border);
    }

    #terminal-stack {
      height: 100%;
      width: 100%;
      position: relative;
    }

    #terminal-stack.terminal-grid {
      display: grid;
      grid-template-columns: repeat(var(--terminal-grid-columns, 1), minmax(0, 1fr));
      grid-template-rows: repeat(var(--terminal-grid-rows, 1), minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      background: #191a1c;
    }

    .terminal-pane {
      position: absolute;
      inset: 0;
      display: none;
    }

    #terminal-stack.terminal-grid .terminal-pane {
      position: relative;
      inset: auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: #191a1c;
    }

    #terminal-stack.terminal-grid .terminal-pane.grid-visible {
      display: block;
    }

    #terminal-stack.terminal-grid .terminal-pane.active {
      border-color: rgba(141, 208, 255, 0.58);
      box-shadow: 0 0 0 2px rgba(141, 208, 255, 0.09);
    }

    .terminal-grid-label {
      display: none;
    }

    #terminal-stack.terminal-grid .terminal-grid-label {
      position: absolute;
      z-index: 2;
      top: 5px;
      right: 6px;
      display: block;
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 3px 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      background: rgba(25, 26, 28, 0.78);
      color: #8995a6;
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .terminal-pane.active {
      display: block;
    }

    .section {
      padding: 12px;
      border-bottom: 1px solid #2b2d30;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9da0a8;
      margin-bottom: 8px;
    }

    .section-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9da0a8;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .section-header span:last-child {
      color: #6f737a;
    }

    .section-body.collapsed {
      display: none;
    }

    #tab-files {
      flex-direction: column;
      gap: 0;
      min-height: 0;
    }

    #tab-files .section {
      flex: 0 0 auto;
    }

    #tab-files .section.tree-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #tree-section {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .path-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .path-row input {
      flex: 1;
      min-width: 0;
    }

    .path-list {
      display: grid;
      gap: 6px;
      max-height: 70px;
      overflow: auto;
      margin-bottom: 8px;
    }

    .path-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .path-item .path-btn {
      flex: 1;
    }

    .path-remove {
      padding: 4px 6px;
      font-size: 11px;
      border-radius: 6px;
    }

    .icon-btn {
      width: 28px;
      min-width: 28px;
      padding: 4px 0;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .subsection-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6f737a;
      margin-bottom: 6px;
    }

    .row select {
      width: 190px;
      flex: 0 0 auto;
    }

    .row button {
      flex: 1 0 auto;
      white-space: nowrap;
    }

    select,
    input,
    button {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #43454a;
      background: #2b2d30;
      color: #bcbec4;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: #4e5157;
    }

	    #status {
	      margin-top: 8px;
	      font-size: 12px;
	      color: #8dd0ff;
	    }

	    #status.error {
	      color: #f38ba8;
	    }
	
	    #status-transfer {
	      margin-top: 8px;
	      display: none;
	      gap: 6px;
	      font-size: 11px;
	      color: rgba(255,255,255,0.72);
	    }
	    #status-transfer.visible { display: grid; }
	    #status-transfer .row {
	      display: flex;
	      justify-content: space-between;
	      gap: 10px;
	      min-width: 0;
	    }
	    #status-transfer .label {
	      overflow: hidden;
	      text-overflow: ellipsis;
	      white-space: nowrap;
	      min-width: 0;
	    }
	    #status-transfer .meta {
	      white-space: nowrap;
	      color: rgba(255,255,255,0.60);
	    }
	    #status-transfer .bar {
	      height: 6px;
	      border-radius: 999px;
	      background: rgba(255,255,255,0.10);
	      overflow: hidden;
	    }
	    #status-transfer .fill {
	      height: 100%;
	      width: 0%;
	      border-radius: 999px;
	      background: linear-gradient(90deg, rgba(57,162,255,0.35), rgba(57,162,255,0.90));
	      transition: width 120ms linear;
	    }
	    #status-transfer.indeterminate .fill {
	      width: 40%;
	      animation: sidebar-transfer-indeterminate 1.1s ease-in-out infinite;
	    }
	    @keyframes sidebar-transfer-indeterminate {
	      0% { transform: translateX(-60%); opacity: 0.7; }
	      50% { transform: translateX(90%); opacity: 1; }
	      100% { transform: translateX(220%); opacity: 0.7; }
	    }

    #file-tree {
      flex: 1;
      overflow: auto;
      font-size: 12px;
      line-height: 1.4;
      min-height: 0;
    }

    .tree-row {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 2px 0;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
    }

    .tree-row:hover {
      color: #8dd0ff;
    }

    .tree-row.selected {
      background: rgba(66, 120, 255, 0.25);
      color: #bcbec4;
    }

    .tree-row.drop-target {
      outline: 1px dashed rgba(141, 208, 255, 0.6);
    }

    .tree-indicator {
      width: 12px;
      display: inline-block;
      color: #9da0a8;
    }

    .tree-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: inline-block;
      background-color: #9da0a8;
      -webkit-mask-position: center;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: contain;
      mask-position: center;
      mask-repeat: no-repeat;
      mask-size: contain;
    }

    .icon-folder {
      background-color: #d9a441;
      -webkit-mask-image: url('./assets/icons/file-icons/folder.svg');
      mask-image: url('./assets/icons/file-icons/folder.svg');
    }

    .icon-folder-open {
      background-color: #d9a441;
      -webkit-mask-image: url('./assets/icons/file-icons/folder-open.svg');
      mask-image: url('./assets/icons/file-icons/folder-open.svg');
    }

    .icon-file {
      background-color: #9da0a8;
      -webkit-mask-image: url('./assets/icons/file-icons/file-outline.svg');

    .command-btn {
      width: 100%;
      margin-bottom: 6px;
      text-align: left;
    }

    .command-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 4px;
      border-radius: 6px;
    }

    .command-row:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .command-main {
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-align: left;
    }

    .command-title {
      font-size: 12px;
      color: #bcbec4;
    }

    .command-sub {
      font-size: 11px;
      color: #6f737a;
    }

    .command-actions {
      display: flex;
      gap: 6px;
    }

    .command-actions button {
      padding: 4px 6px;
      font-size: 11px;
    }

    .command-editor {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }

    .command-editor .row {
      gap: 6px;
    }

    .ghost-btn {
      background: transparent;
      border-color: #43454a;
      color: #9da0a8;
    }

    .path-btn {
      width: 100%;
      text-align: left;
    }

    .tree-more {
      color: #6f737a;
    }

    #commands {
      max-height: 160px;
      overflow: auto;
    }

    .transfer-block {
      display: grid;
      gap: 6px;
      margin-bottom: 10px;
    }

    #transfer-status {
      max-height: 120px;
      overflow: auto;
      font-size: 11px;
      color: #9da0a8;
    }

    .transfer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
    }

    .transfer-row.complete {
      color: #a6e3a1;
    }
	
    .transfer-main {
      min-width: 0;
      display: grid;
      gap: 4px;
    }
    .transfer-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .transfer-bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .transfer-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(57,162,255,0.35), rgba(57,162,255,0.85));
      transition: width 120ms linear;
    }
    .transfer-row.complete .transfer-bar-fill {
      width: 100%;
      background: linear-gradient(90deg, rgba(166,227,161,0.35), rgba(166,227,161,0.95));
    }
    .transfer-row.indeterminate .transfer-bar-fill {
      width: 40%;
      animation: transfer-indeterminate 1.1s ease-in-out infinite;
    }
    @keyframes transfer-indeterminate {
      0% { transform: translateX(-60%); opacity: 0.7; }
      50% { transform: translateX(90%); opacity: 1; }
      100% { transform: translateX(220%); opacity: 0.7; }
    }

    .context-menu {
      position: fixed;
      min-width: 140px;
      background: #2b2d30;
      border: 1px solid #43454a;
      border-radius: 8px;
      padding: 6px;
      display: none;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      max-height: min(80vh, 560px);
      overflow-y: auto;
    }

    .context-menu.open {
      display: block;
    }

    .context-menu button {
      width: 100%;
      text-align: left;
      padding: 6px 8px;
      border: none;
      background: transparent;
    }

    .context-menu button:hover {
      background: #393b40;
    }

    .context-menu button:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .context-menu button:disabled:hover {
      background: transparent;
    }

    .context-menu-label {
      padding: 8px 8px 4px;
      color: #697587;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .context-menu button.checked::before {
      content: "✓";
      display: inline-block;
      width: 16px;
      color: #8dd0ff;
    }

    .context-menu button.danger {
      color: #f1a0b2;
    }

    .context-menu .color-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-color-swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 3px;
      background: var(--tab-dot, #596577);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(25, 26, 28, 0.7);
      z-index: 2000;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      width: 360px;
      max-width: 90vw;
      background: #2b2d30;
      border: 1px solid #43454a;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      display: grid;
      gap: 10px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: #bcbec4;
    }

    .modal-subtitle {
      font-size: 12px;
      color: #9da0a8;
    }

    .modal-message {
      font-size: 12px;
      color: #bcbec4;
    }

    .modal-field {
      display: grid;
      gap: 6px;
      font-size: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-actions .ghost-btn {
      background: transparent;
      border-color: #43454a;
      color: #9da0a8;
    }

    .modal-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #9da0a8;
    }

    .modal-checkbox input {
      width: 14px;
      height: 14px;
    }
  </style>

<body>
  <div id="app">
    <div id="sidebar">
      <div class="section">
        <div class="section-title">Connection</div>
        <div class="row">
          <select id="host-select"></select>
          <button id="connect-btn">Connect</button>
        </div>
	        <div id="status">Disconnected</div>
	        <div id="status-transfer">
	          <div class="row">
	            <div class="label" id="status-transfer-label"></div>
	            <div class="meta" id="status-transfer-meta"></div>
	          </div>
	          <div class="bar"><div class="fill" id="status-transfer-fill"></div></div>
	        </div>
	      </div>
      <div id="tabs">
        <button class="tab-btn active" data-tab="files">Files</button>
        <button class="tab-btn" data-tab="actions">Actions</button>
      </div>
      <div id="tab-panels">
        <div id="tab-files" class="tab-panel active">
          <div class="section tree-section">
            <button class="section-header" data-section="tree">
              <span>Remote File Tree</span>
              <span id="tree-chevron">▾</span>
            </button>
            <div class="section-body" id="tree-section">
              <div class="path-row">
                <button id="back-btn" class="icon-btn" title="Back" aria-label="Back">&lt;</button>
                <button id="forward-btn" class="icon-btn" title="Forward" aria-label="Forward">&gt;</button>
                <input type="text" id="path-input" placeholder="/remote/path" />
                <button id="path-go-btn" class="icon-btn" title="Go" aria-label="Go">⏎</button>
                <button id="path-save-btn" class="icon-btn" title="Save location" aria-label="Save location">★</button>
              </div>
              <div id="file-tree">Not connected</div>
            </div>
          </div>
          <div class="section">
            <button class="section-header" data-section="saved">
              <span>Saved Locations</span>
              <span id="saved-chevron">▾</span>
            </button>
            <div class="section-body" id="saved-section">
              <div id="saved-paths" class="path-list"></div>
            </div>
          </div>
          <div class="section">
            <button class="section-header" data-section="recent">
              <span>Recent Locations</span>
              <span id="recent-chevron">▾</span>
            </button>
            <div class="section-body" id="recent-section">
              <div id="recent-paths" class="path-list"></div>
            </div>
          </div>
        </div>
        <div id="tab-actions" class="tab-panel">
          <div class="section">
            <div class="section-title">Port Forwarding</div>
            <div id="tunnels-list"></div>
            <div class="command-editor" style="margin-top: 8px;">
              <div class="row">
                <select id="tunnel-type">
                  <option value="local">Local Forward</option>
                  <option value="remote">Remote Forward</option>
                  <option value="dynamic">Dynamic (SOCKS)</option>
                </select>
              </div>
              <div class="row">
                <input id="tunnel-src-port" type="number" placeholder="Src Port" style="width: 80px;" />
                <input id="tunnel-dst" type="text" placeholder="Dst Host:Port" />
                <button id="add-tunnel-btn">Add</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
    <div id="workspace">
      <div id="session-bar">
        <div id="session-tabs-row">
          <button id="sidebar-collapse-btn" class="icon-btn" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true"><i data-icon="panel-left-close"></i></button>
          <div id="session-tabs"></div>
          <button id="saved-groups-btn" class="icon-btn" title="Saved groups" aria-label="Saved groups"><i data-icon="folders"></i></button>
          <button id="new-group-btn" class="icon-btn" title="Create group from active tab" aria-label="Create group from active tab"><i data-icon="folder-plus"></i></button>
          <button id="new-tab-btn" class="icon-btn" title="New tab" aria-label="New tab"><i data-icon="plus"></i></button>
        </div>
        <div id="view-toolbar"></div>
      </div>
      <div id="dock-root">
        <div id="terminal-stack"></div>
      </div>
      <div id="statusbar"></div>
    </div>
  </div>
  <dialog id="password-modal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="password-title">
      <div id="password-title" class="modal-title">SSH Password Required</div>
      <div id="password-host" class="modal-subtitle"></div>
      <div id="password-message" class="modal-message"></div>
      <div id="password-attempt" class="modal-subtitle"></div>
      <label class="modal-field">
        <span>Password</span>
        <input id="password-input" type="password" autocomplete="current-password" />
      </label>
      <label class="modal-checkbox">
        <input id="password-remember" type="checkbox" />
        <span id="password-remember-text">Remember password for this host</span>
      </label>
      <div class="modal-actions">
        <button id="password-cancel" class="ghost-btn" type="button">Cancel</button>
        <button id="password-submit" type="button">Connect</button>
      </div>
    </div>
  </dialog>
  <script src="./node_modules/xterm/lib/xterm.js"></script>
  <script src="./node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="./node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script type="module" src="renderer/index.js"></script>

</html>
